<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кабинет сотрудника - Прогноз востребованности специальностей</title>
    <link rel="stylesheet" href="static/css/employee.css">
</head>
<body>
    <!-- Сайдбар -->
    <aside class="sidebar">
        <div class="logo">
            <i class="icon">🎓</i> EduPredict
        </div>

        <div class="user-info">
            <div class="user-role">Сотрудник вуза</div>
            <button class="btn-logout">Выйти</button>
        </div>

        <ul class="nav-menu">
            <li class="nav-item active">
                <i class="icon">📊</i> Прогнозирование
            </li>
            <li class="nav-item">
                <i class="icon">📃</i> Специальности
            </li>
            <li class="nav-item">
                <i class="icon">📈</i> Статистика ЕГЭ
            </li>
            <li class="nav-item special active"> <!-- Активный пункт как на скрине -->
                <i class="icon">📚</i> Отчёты
            </li>
        </ul>
    </aside>

    <!-- Основной контент -->
    <main class="main-content">
        
        <!-- Верхняя шапка -->
        <header class="page-header">
            <h1 class="page-title">Прогноз востребованности специальностей</h1>
            <div class="header-actions">
                <button class="btn btn-secondary">
                    <i class="icon">⚙️</i> Настройки
                </button>
                <button class="btn btn-primary">
                    <i class="icon">️</i> Экспорт данных
                </button>
            </div>
        </header>

        <!-- Блок фильтров -->
        <section class="card">
            <div class="card-header">Параметры прогноза</div>
            
            <div class="filters-grid">
                <!-- Направление подготовки -->
                <div class="form-group">
                    <label class="form-label required">Направление подготовки</label>
                    <select class="form-control">
                        <option value="all">Все специальности</option>
                    </select>
                </div>

                <!-- Горизонт прогноза -->
                <div class="form-group">
                    <label class="form-label">Горизонт прогноза</label>
                    <div class="date-range">
                        <select class="form-control">
                            <option selected>2024</option>
                            <option>2025</option>
                            <option>2026</option>
                            <option>2027</option>
                        </select>
                        <span class="date-separator">–</span>
                        <select class="form-control">
                            <option selected>2025</option>
                            <option>2026</option>
                            <option>2027</option>
                            <option>2028</option>
                        </select>
                    </div>
                </div>

                <!-- Исторические данные -->
                <div class="form-group">
                    <label class="form-label">Исторические данные</label>
                    <div class="date-range">
                        <select class="form-control">
                            <option selected>2019</option>
                            <option>2020</option>
                            <option>2021</option>
                            <option>2022</option>
                        </select>
                        <span class="date-separator">–</span>
                        <select class="form-control">
                            <option>2020</option>
                            <option>2021</option>
                            <option>2022</option>
                            <option selected>2023</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="actions-row">
                <button class="btn btn-primary btn-lg" id="btnGenerate">
                    <i class="icon"></i> Сформировать отчёт
                </button>
                <button class="btn btn-secondary btn-lg" id="btnReset">
                    <i class="icon">🔄</i> Сбросить фильтры
                </button>
            </div>
        </section>

    </main>

    <script src="static/js/employee.js"></script>
</body>
</html>
