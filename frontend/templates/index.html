<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прогноз востребованности специальностей</title>
    <link rel="stylesheet" href="static/css/index.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🎓 EduPredict</h1>
            <p class="subtitle">Система прогнозирования востребованности направлений подготовки</p>
        </header>

        <main class="main-content">
            <h2 class="welcome-text">Выберите вашу роль для продолжения</h2>
            
            <div class="role-selection">
                <button class="role-card" id="role-employee" data-role="employee">
                    <div class="icon">💼</div>
                    <h3>Сотрудник вуза</h3>
                    <p>Управление данными, формирование отчётов и аналитика специальностей</p>
                </button>
                <button class="role-card" id="role-applicant" data-role="applicant">
                    <div class="icon">🎯</div>
                    <h3>Абитуриент</h3>
                    <p>Подбор приоритетных направлений на основе результатов ЕГЭ</p>
                </button>
            </div>

            <button class="continue-btn" id="continue-btn" disabled>
                Продолжить
                <span class="arrow">→</span>
            </button>
        </main>

        <footer class="footer">
            
        </footer>
    </div>
    <script src="static/js/index.js"></script>
</body>
</html>
